<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#141414">
  <title>Pixel Vault — Pixel FX Library</title>
  <link rel="stylesheet" href="style.css">
  <script defer src="effects.js"></script>
  <script defer src="character.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
  <header class="top">
    <a class="brand" href="./"><span aria-hidden="true">✦</span> PIXEL VAULT</a>
    <div class="actions" data-management>
      <button id="load-library">Import library</button>
      <button id="save-library">Export library</button>
      <button id="restore-samples" disabled>คืนค่าตัวอย่าง</button>
      <button class="accent" id="add">＋ Add sprite sheet</button>
      <input id="library-file" type="file" accept=".json,application/json" hidden>
    </div>
  </header>
  <main>
    <section class="intro">
      <h1>Pixel FX<span>.</span></h1>
      <p>คลังเอฟเฟกต์และตัวละครพิกเซลสำหรับเกมของคุณ</p>
    </section>
    <div class="workspace">
      <section class="library" aria-label="คลัง Asset">
        <div class="library-head"><h2>Library</h2><span id="count"></span></div>
        <input type="search" id="search" placeholder="Search assets…" aria-label="ค้นหา Asset">
        <div id="filters" class="filters" aria-label="หมวดหมู่"></div>
        <div id="gallery" class="gallery"></div>
      </section>
      <section id="studio" class="studio" aria-label="ตัวอย่างและส่งออก">
        <div class="studio-head">
          <div><p class="category" id="category"></p><h2 id="title"></h2></div>
          <span class="spec" id="spec"></span>
        </div>
        <div id="stage" class="stage" data-backdrop="grid">
          <canvas id="preview" aria-label="ภาพตัวอย่าง Asset"></canvas>
          <span id="frame-number"></span>
        </div>
        <div class="timeline">
          <button id="play" aria-label="เล่นหรือหยุดตัวอย่าง">Ⅱ Pause</button>
          <button id="restart" aria-label="เริ่มใหม่">↺</button>
          <input id="frame" type="range" min="0" value="0" aria-label="เฟรม">
        </div>
        <div class="controls">
          <label>Backdrop <select id="backdrop"><option value="grid">Checker</option><option value="dark">Dark</option><option value="light">Light</option></select></label>
          <label>Palette <select id="palette"><option value="original">Original</option><option value="ember">Ember</option><option value="mint">Mint</option><option value="violet">Violet</option><option value="ice">Ice</option></select></label>
          <label>FPS <input id="fps" type="number" min="1" max="60" step="1" required></label>
          <label>PPU <input id="ppu" type="number" min="1" max="1024" step="1" value="64" required></label>
          <label class="check"><input id="mirror" type="checkbox"> Mirror</label>
          <label class="check"><input id="loop" type="checkbox"> Loop</label>
          <button id="seed">↻ New seed</button>
        </div>
        <div id="character-controls" class="controls" hidden>
          <label>Direction <select id="direction"><option value="0">Down</option><option value="1">Left</option><option value="2">Right</option><option value="3">Up</option></select></label>
          <label>Shirt color <input id="shirt-color" type="color"></label>
          <label>Hair color <input id="hair-color" type="color"></label>
          <label>Seed <input id="character-seed" type="number" min="0" max="4294967295" step="1" required></label>
          <button id="random-character-seed">↻ New seed</button>
        </div>
        <div class="export">
          <div><button id="sheet">Sprite sheet</button><button id="download-original" hidden>↓ PNG ต้นฉบับ</button><button id="edit" data-management hidden>แก้ไข Asset</button><button id="remove" class="danger" data-management>ลบ Asset</button></div>
          <button id="save-character" class="accent" data-management hidden>＋ Save to Library</button>
          <button id="export" class="accent">↓ Export Unity ZIP</button>
          <button id="export-group" class="accent" hidden>↓ Export Character ZIP</button>
        </div>
      </section>
    </div>
    <p role="status" id="status"></p>
    <button id="undo-remove" data-management hidden>เลิกทำการลบ</button>
  </main>
  <dialog id="upload">
    <form id="upload-form">
      <div class="library-head"><h2 id="upload-title">Add sprite sheet</h2><button type="button" id="close-upload" aria-label="ปิด">×</button></div>
      <label id="image-field">PNG sprite sheet <input name="image" type="file" accept="image/png,.png" required></label>
      <label>ชื่อ <input name="name" maxlength="80" required></label>
      <label>หมวดหมู่ <input name="category" maxlength="30" value="Custom" required></label>
      <div class="fields" id="grid-fields">
        <label>Frame width <input name="width" type="number" value="64" min="1" max="512" required></label>
        <label>Frame height <input name="height" type="number" value="64" min="1" max="512" required></label>
        <label>Frames <input name="frames" type="number" value="16" min="1" max="120" required></label>
        <label>FPS <input name="fps" type="number" value="12" min="1" max="60" required></label>
        <label>Pivot <select name="pivot"><option value="center">กึ่งกลาง</option><option value="feet">กึ่งกลางด้านล่าง</option></select></label>
        <label class="check"><input name="loop" type="checkbox" checked> Loop</label>
        <label id="start-field" hidden>เฟรมเริ่มต้น <input name="start" type="number" value="1" min="1" max="67108864" required></label>
      </div>
      <label id="group-field">กลุ่มตัวละคร <input name="group" list="character-groups" maxlength="80" placeholder="เว้นว่างได้เมื่อเป็นคลิปเดี่ยว"></label>
      <datalist id="character-groups"></datalist>
      <label id="split-field"><input name="split" type="checkbox"> แบ่งคลิปตามแถว</label>
      <div id="row-settings" hidden></div>
      <div id="import-preview" hidden>
        <p id="grid-summary"></p>
        <div class="sheet-scroll"><canvas id="import-grid" aria-label="กริดเฟรมของ Sprite Sheet"></canvas></div>
        <div class="actions"><label>พรีวิวคลิป <select id="preview-clip"></select></label><canvas id="import-animation" aria-label="พรีวิวแอนิเมชัน"></canvas></div>
      </div>
      <p id="grid-help">ใช้กริดเฟรมขนาดเท่ากัน เรียงจากซ้ายไปขวาและบนลงล่าง</p>
      <p role="alert" id="upload-error"></p>
      <button class="accent" type="submit">บันทึกเข้าคลัง</button>
    </form>
  </dialog>
  <dialog id="sheet-dialog">
    <div class="library-head"><h2 id="sheet-title">Sprite sheet</h2><button id="close-sheet" aria-label="ปิด">×</button></div>
    <p id="sheet-details" hidden>128 × 128 px · 16 frames · 8 FPS · Loop<br>แถวจากบนลงล่าง: Down, Left, Right, Up</p>
    <div class="sheet-scroll"><canvas id="sheet-preview"></canvas></div>
    <div id="character-exports" class="actions" hidden>
      <button class="accent" id="export-png">↓ Export PNG</button>
      <button id="export-json">↓ Export JSON</button>
      <p role="alert" id="character-export-error"></p>
    </div>
  </dialog>
</body>
</html>
