name: Publish Pixel Vault

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pixel-vault-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Build PNG catalog
        run: python3 tools/build_pages.py --output _site
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish catalog
        id: deployment
        uses: actions/deploy-pages@v4
